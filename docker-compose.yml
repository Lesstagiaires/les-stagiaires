services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stagiaires
      POSTGRES_PASSWORD: stagiaires
      POSTGRES_DB: stagiaires
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Démon d'analyse anti-malware (CLAUDE.md §4) — utilisé quand
  # MALWARE_SCANNER_PROVIDER="clamav". Le premier démarrage peut prendre plusieurs
  # minutes le temps que freshclam télécharge la base de signatures ; clamav_data
  # la conserve entre redémarrages pour éviter de la retélécharger à chaque fois.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  redis_data:
  clamav_data:
